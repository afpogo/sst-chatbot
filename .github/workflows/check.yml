name: Repository check

on:
  push:
    branches:
      - main
      - develop
      - "agent/**"
  pull_request:
    branches:
      - main
      - develop

permissions:
  contents: read

concurrency:
  group: repository-check-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: ARDS, tests, smoke and coverage
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt coverage

      - name: Run repository gate
        run: python scripts/check.py

      - name: Enforce governed RAG coverage
        run: |
          python -m coverage run --source=src/app/governed_rag -m pytest tests/test_governed_rag.py tests/test_governed_rag_specs.py
          python -m coverage report --show-missing --fail-under=90
