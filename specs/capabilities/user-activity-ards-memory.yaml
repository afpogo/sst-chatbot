version: 1
kind: capability
id: user-activity-ards-memory
status: draft
title: User activity ARDS memory
goal: Convert relevant SST conversations, decisions, comments, and application events into governed internal ARDS memory records.
authority_boundary:
  role: "proposal_producer"
  rules:
    - ARDS memory records are operational context, not authoritative SST business state.
    - User-visible, downloadable, workspace, or application mutations require a separate orchestrator-governed request and deterministic validation.
    - Raw chat and runtime events are evidence inputs; they do not become application facts automatically.
orchestrator_link:
  orchestrator_repo: "4uentes-orchestor"
  state_kind: "feature_state"
  state_id: "sst-chatbot"
  capability_id: "capability.inbound.sst-chatbot-agent-handoff"
  work_origin: "orchestrator-request"
  request_id: "CR-SST-0021"
  evidence_ref: "evidence/requests/CR-SST-0021/implementation-summary.md"
  status_hint: "implemented-local"
  correlation_id: "CR-SST-0021"
inputs:
  - normalized_activity_event
  - chatbot_message
  - application_context_connector
  - repo_discovery_handoff
outputs:
  - memory_record
  - optional_user_history_update_intent
  - optional_workspace_generation_intent
storage_layers:
  activity_event_log:
    description: Raw or normalized source events. Used as evidence and audit input.
  internal_ards_memory:
    description: Tagged, governed, provenance-aware memory records.
  generated_ards_sdd_workspace:
    description: Curated user or project artifacts derived from approved memory.
memory_record:
  required_fields:
    - memory_id
    - source_event_id
    - account_id
    - application_id
    - actor
    - entity
    - activity
    - tags
    - visibility
    - lifecycle_status
    - provenance
    - body
    - body_hash
    - created_at
  implementation_refs:
    - src/app/memory/types.py
    - src/app/memory/validation.py
    - src/app/memory/store.py
    - src/app/memory/phases.py
    - src/app/memory/visibility.py
    - src/app/memory/handoff.py
  tag_groups:
    - domain
    - kind
    - scope
    - visibility
    - status
    - source
provenance:
  concepts:
    agent: User, robot, chatbot agent, backend service, or orchestrator job.
    activity: Capture, classify, approve, revise, generate, or invalidate.
    entity: Comment, decision, evidence, gap, task, spec, ADR, or bundle.
  relations:
    - was_derived_from
    - was_attributed_to
    - was_revision_of
    - was_invalidated_by
governance_rules:
  - Raw chat must not automatically become workspace files.
  - Tags must be structured attributes.
  - Memory must declare whether it is indexable, downloadable, and user visible.
  - Retrieval must filter by account, application, domain, and permission scope.
  - Corrections should create a new memory record or lifecycle transition.
  - Generated ARDS/SDD artifacts must reference source memory records.
  - Memory records must not be treated as authoritative product records for SST.
robots_context:
  discovery_source: CR-SST-0006
  current_state: runtime-partial
  safe_intents:
    - user_history.propose_update
    - workspace.generate_bundle
  blocked_intents:
    - workspace.apply_patch
    - server.restart_service
    - server.refresh_cache
validation:
  tests:
    - Memory records require tags and provenance.
    - Invalid visibility combinations are rejected.
    - Robots discovery creates evidence and gap records, not server intents.
    - Retrieval candidates are filtered by account and application scope.
    - Workspace generation can cite source memory records.
    - CR-SST-0021 tests cover governed records, phase runs, in-memory store idempotency, fake provider execution, visibility candidates, and orchestrator handoff payload mapping.
