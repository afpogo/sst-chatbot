version: 1
kind: capability
id: prompt-catalog-and-versioning
status: draft
title: Private prompt catalog and versioning
goal: Keep SST chatbot prompts private, versioned, validated, and easy to render for agents.
ownership:
  this_repository:
    - prompt contracts
    - prompt catalog
    - prompt validation
    - prompt rendering
    - prompt trace metadata
  external_services:
    - model execution
    - optional metadata-only observability
storage:
  v1:
    backend: repo_yaml
    path: src/app/prompts/catalog
    discovery: explicit_registry_allowlist
  future:
    backend: private_prompt_registry_service
    requirements:
      - approval workflow
      - rollback
      - access control
      - audit log
      - evaluation gates
contract:
  required_fields:
    - id
    - version
    - status
    - description
    - messages
    - variables
    - visibility
    - trace_policy
    - provider_cache_policy
    - compatible_providers
    - compatible_models
  allowed_roles:
    - system
    - human
    - assistant
  trace_policy:
    default: metadata_only
    allowed:
      - metadata_only
  visibility:
    default: internal_private
    allowed:
      - internal_private
  provider_cache_policy:
    default: none
    allowed:
      - none
      - in_memory
      - 24h
lifecycle:
  stages:
    - id: discovery
      description: Identify capability, task, variables, sensitivity, and compatible providers or models.
    - id: design
      description: Define id, version, status, messages, variables, visibility, trace policy, cache policy, providers, and models.
    - id: author
      description: Create or edit YAML under src/app/prompts/catalog.
    - id: register
      description: Add the prompt path to the explicit registry allowlist.
    - id: static_validation
      description: Validate required metadata, roles, declared variables, placeholders, and variable types.
    - id: local_render
      description: Render locally with fake or mock variables before provider execution.
    - id: assemble
      description: Convert rendered messages to framework-specific messages only at the integration boundary.
    - id: execute
      description: Send rendered messages to the provider adapter; providers do not read prompt YAML.
    - id: trace
      description: Record metadata-only trace data including prompt id, version, hash, provider, model, and variable names.
    - id: validate
      description: Run prompt tests and ARDS/SDD checks.
    - id: promote
      description: Promote draft prompts to stable only after tests and supporting evidence.
    - id: deprecate
      description: Mark old versions deprecated after consumers migrate.
  agent_rules:
    - New capabilities or tasks create new prompt ids.
    - Observable behavior changes require a new prompt version unless the prompt is still draft.
    - Stable prompts must not be edited in place for behavior changes.
    - Consumed prompt versions should be deprecated before removal.
    - Provider options, memory retrieval rules, and external execution rules stay outside prompt YAML.
    - Sensitive variables must be marked sensitive.
rules:
  - LangSmith is not the source of prompts.
  - Prompt bodies must not be intentionally added to trace metadata.
  - Internal private prompts default to no provider prompt-cache retention.
  - Provider adapters receive rendered messages, not YAML.
  - Prompts must declare all variables used by templates.
  - Render input must not include undeclared variables.
  - Prompt files are behavior changes and require tests.
validation:
  tests:
    - tests/test_prompt_engine.py
  commands:
    - .\\.venv\\Scripts\\python.exe -m pytest
    - .\\.venv\\Scripts\\python.exe scripts\\ards_check.py
    - .\\.venv\\Scripts\\python.exe scripts\\check.py
