version: 1
kind: capability
id: retrieval-augmented-generation
status: active
title: Retrieval augmented generation for SST agents
goal: Add private, recent, and workspace-scoped SST context to agent responses without coupling SST to a provider or vector database.
layers:
  ingestion:
    description: Load private SST sources into normalized documents.
    required_metadata:
      - source_id
      - title
      - document_type
      - workspace_id
      - source_tier
      - owner_tier
      - origin
  indexing:
    description: Split documents into chunks that preserve source metadata.
  retrieval:
    description: Retrieve relevant chunks only after deterministic scope, permission, classification, source and content-safety authorization.
  generation:
    description: Inject retrieved context into a prompt and generate an answer with sources.
vector_retrieval_lifecycle:
  status: candidate_pattern
  description: Architecture pattern for turning source documents into governed vector-searchable chatbot context.
  steps:
    - normalize_source_text
    - build_canonical_text
    - validate_token_budget
    - split_into_chunks
    - classify_and_authorize_source_metadata
    - generate_chunk_embeddings
    - persist_vector_with_metadata
    - embed_query
    - search_by_similarity_with_mandatory_scope_filters
    - revalidate_authorized_projection
    - deduplicate_or_rerank
    - return_context_with_sources
  required_vector_metadata:
    - chunk_id
    - source_id
    - workspace_id
    - account_id
    - source_tier
    - origin
    - embedding_model
    - embedding_dimension
    - pipeline_version
    - indexable
  rebuild_triggers:
    - embedding_model_changed
    - embedding_dimension_changed
    - chunking_policy_changed
    - required_metadata_contract_changed
ingestion_modes:
  - internal_governance:
      description: Static internal corpus used as product guidance.
      update_mode: controlled_repo_release
  - generated_user_workspace_bootstrap:
      description: Generic user workspace baseline generated during onboarding.
      update_mode: deterministic_generator
  - generated_user_workspace_sync:
      description: User workspace synchronization from scripts in another repo.
      update_mode: scripted_sync_with_validation
retriever_strategies:
  - similarity
  - similarity_score_threshold
  - mmr
  - future_hybrid
contract_rules:
  - SST must not call LangChain or provider SDKs directly.
  - SST should depend on a retriever contract, not a vector store implementation.
  - Retrieval must authorize tenant, user, application, entitlements, classification and source before ranking.
  - Ranking and provider adapters have no access-granting authority.
  - Restricted, secret and credential-like content must never reach ranking, provider calls, traces or outbound evidence.
  - Answers grounded in private documents must represent every factual claim as structured output with citations to retrieved chunks.
  - Unknown, absent or fabricated citations fail closed.
  - Unit tests must run without external provider calls.
  - Internal ARDS/SDD knowledge and generated user artifacts must remain separated by metadata and ownership.
  - User workspace context starts generic and can be specialized after validated sync.
  - Synced documentation should carry source provenance (`origin`, `source_tier`, `sync_revision`) for audit and retrieval filtering.
  - Vector records must persist embedding model, embedding dimension, and pipeline version.
  - Vector indexes should be rebuilt or migrated deliberately when embedding or chunking policy changes.
future_adapters:
  embeddings:
    - openai
    - anthropic_or_other_provider
    - local_model
  vector_stores:
    - in_memory_for_tests
    - postgres_pgvector
    - dedicated_vector_database
validation:
  tests:
    - Documents preserve metadata.
    - Documents include source_tier and origin for filtering.
    - Splitting creates bounded chunks.
    - Vector records preserve embedding model and pipeline version metadata.
    - Retrieval filters tenant, user, application, entitlements, classification and source before ranking.
    - Inactive, non-indexable, restricted, secret and credential-like records never reach retriever or provider ports.
    - Weak retrieval returns insufficient_context without calling a provider.
    - Provider claims with unknown citations fail closed.
    - Metadata-only traces exclude queries, context, tenant and user identifiers.
    - Sync provenance is preserved during ingestion.
    - Chain answers from retrieved context.
local_implementation:
  status: implemented-local
  request_id: CR-SST-0155
  scope: provider-agnostic-governed-kernel-with-fakes
  code:
    - src/app/governed_rag/contracts.py
    - src/app/governed_rag/ports.py
    - src/app/governed_rag/policy.py
    - src/app/governed_rag/retriever.py
    - src/app/governed_rag/runtime.py
    - src/app/governed_rag/fakes.py
  tests:
    - tests/test_governed_rag.py
    - tests/test_governed_rag_specs.py
  smoke: scripts/smoke_governed_rag.py
  state_ref: specs/states/sst-user-governed-rag-v1.yaml
  owner_doc_ref: docs/architecture/governed-user-memory-rag.md
  integration_status: not-connected-to-chat-runtime
control_plane_link:
  repo: 4uentes-orchestor
  request_id: CR-SST-0155
  state_id: sst-user-ards-rag
  capability_id: retrieval-augmented-generation
  source_of_truth: false
non_goals:
  - Canonical user-memory persistence.
  - Database or vector-store adoption.
  - Real or paid LLM provider integration.
  - HTTP, Socket.IO or current chat runtime integration.
  - Raw chat or event ingestion.
  - Memory writes, orchestrator handoffs or stakeholder metrics.
