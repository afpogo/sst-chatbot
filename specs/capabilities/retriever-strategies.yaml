version: 1
kind: capability
id: retriever-strategies
status: candidate
title: Retriever strategies for SST agents
goal: Define retrieval as a stable contract that can use vector stores, lexical search, MMR, thresholds, metadata filters, or future hybrid strategies.
concepts:
  retriever:
    description: Receives a natural language query and returns relevant documents.
  vector_store:
    description: Stores embeddings and may provide one retrieval backend.
  mmr:
    description: Selects results that balance relevance with diversity.
sst_relevance:
  internal_ards_sdd:
    description: Knowledge base used by the product to guide generation.
    examples:
      - template catalog
      - safe generation rules
      - maturity levels
      - approved examples
  generated_ards_sdd:
    description: User-owned downloadable output generated by the agent.
    examples:
      - AGENTS.md
      - docs/00-overview.md
      - specs/00-index.yaml
candidate_strategies:
  - id: similarity
    use_when: Corpus is small and direct relevance is enough.
  - id: similarity_score_threshold
    use_when: The agent should avoid answering with weak context.
  - id: mmr
    use_when: The corpus has redundant chunks and the answer benefits from diverse context.
  - id: hybrid
    use_when: The corpus grows and needs lexical, semantic, and metadata-aware retrieval.
contract_rules:
  - SST should depend on retriever behavior, not on vector store implementation.
  - Retrieval must apply authorization and workspace filters before generation.
  - Internal ARDS/SDD knowledge must stay separate from generated user artifacts.
  - Retriever outputs should preserve source metadata for traceability.
validation:
  tests:
    - Similarity returns relevant internal template documents.
    - Threshold retrieval can return no context.
    - MMR returns diverse context when candidates overlap.
    - Generated artifact content is not mixed with internal governance by default.
