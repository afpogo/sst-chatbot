schema_version: "1.0"
version: 1
kind: feature_state
id: sst-user-governed-rag-v1
status: in-progress
title: Governed read-only RAG for SST user memory V1
updated_at: "2026-08-13"
owner: sst-chatbot
control_plane_link:
  repo: 4uentes-orchestor
  request_id: CR-SST-0155
  state_id: sst-user-ards-rag
  capability_id: retrieval-augmented-generation
  status_hint: implemented-local
implemented:
  - Immutable retrieval scope and governed memory record contracts.
  - Deterministic authorization before ranking across tenant, user, application, entitlements, classification and source.
  - Absolute exclusion for inactive, non-indexable, restricted, secret and credential-like content.
  - Replaceable source, retriever and grounded-answer ports.
  - Deterministic lexical retriever over already-authorized chunks.
  - Bounded provider context and structured claim/citation validation.
  - Metadata-only decision trace with sanitized error codes.
  - Positive and negative fake-provider smoke.
pending:
  - Approve the canonical SST source contract for promoted user-memory records.
  - Connect the governed runtime to chat only through a separate integration request.
  - Evaluate a real provider and vector store only after source ownership and secret custody are approved.
non_goals:
  - Read raw chats or operational events.
  - Persist canonical memory or vectors.
  - Call OpenAI or any external provider.
  - Change the HTTP or Socket.IO runtime.
  - Emit memory writes or orchestrator handoffs.
