id: sst-stakeholder-metrics-rag-v1
status: in-progress
title: Governed RAG for SST stakeholder metrics V1
updated_at: "2026-08-13"
owner: sst-chatbot
control_plane_link:
  repo: 4uentes-orchestor
  request_id: CR-SST-0156
  state_id: sst-stakeholder-metrics-rag
  capability_id: sst-stakeholder-insights
  status_hint: implemented-local
implemented:
  - Existing closed monthly MetricQuery and MetricSnapshot catalog remains the only KPI value authority.
  - Minimum cohort, provenance and exact structured-claim checks happen before disclosure.
  - Owner-controlled methodology source, authorization projection, retriever and grounded-answer ports.
  - Authorization before ranking by metric, active/indexable state, classification and entitlement.
  - Documentary citations restricted to methodology actually retrieved for the turn.
  - Non-numeric narrative with exact MetricClaim validation against the analytics snapshot.
  - Metadata-only trace and sanitized fail-closed errors.
  - Positive and disclosure-blocking deterministic smoke.
pending:
  - Approve and implement the canonical methodology repository.
  - Connect a real analytics adapter and a real retrieval index under separate requests.
  - Integrate the runtime with chat only after provider, secret-custody and transport contracts are approved.
non_goals:
  - Read tenant, person, conversation or raw analytics records.
  - Calculate KPI values from retrieved documents or provider output.
  - Call OpenAI or any external provider.
  - Change HTTP, Socket.IO or handoff behavior.
